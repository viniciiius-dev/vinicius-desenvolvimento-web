<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <link rel="stylesheet" href="./css/template.css">
    <style>
        form{
            display:grid;
            max-width: 300px;
            margin: 0 auto;
            border:1px solid orangered;
            border-radius:5px;
            padding:20px;
            background-color: azure;
        }
        label {
            color: crimson;
            margin-bottom: 5px;

        }
        input{
            margin-bottom: 10px;
            padding: 7px;
            background-color: beige;
            outline: none;
            border: 1px solid orangered;
            border-radius: 5px;
            font-size: 18px;
        }
        input:focus {
            background-color: white;
        }
        button {
            cursor: pointer;
            padding: 10px;
            border: 1px solid chocolate;
            font-size: 10px;
            font-weight: bold;
            background-color: chocolate;
            color: white;
            border-radius: 5px;
        }
        button:hover {
            background-color: rgb(230,114,32 green blue / alpha);
            color: yellow;
            box-shadow: 5px 5px 8px rgba(149,81,57,.8);
        }
        </style>
</head>
<body>
    <header>
        <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="titulos.html">Títulos</a></li>
        <li><a href="paragrafos.html">Parágrafos</a></li>
        <li><a href="divs.html">Divs</a></li>
        <li><a href="tabelas.html">Tabelas</a></li>
        <li><a href="formularios.html">Formulario</a></li>

      </ul>
    </header>
    <h1 id="topo">Formulário</h1>
    
    <div id="conteudo">
        <form>
            <label for="usuario">Usuário</label>
            <input id ="usuario" name="usuario" type="text" placeholder="Seu Nome">
            <label for="senha">Senha</label>
            <input id="senha" name="senha"type="password" placeholder="Senha">
            <button>Logar</button>
        </form>
    </div>
</body>
</html>
